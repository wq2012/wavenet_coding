# Parametric WaveNet Coder with Speaker Overlap (W_w, 2.4 kb/s -> 16 kHz)
mode: "parametric"
sample_rate: 16000
quantization_channels: 256
mu: 255
num_blocks: 2
layers_per_block: 10
residual_channels: 64
dilation_channels: 64
skip_channels: 128
filter_width: 2
use_conditioning: true
cond_dim: 16
cond_frame_rate_hz: 100
cond_conv_channels: 64
cond_conv_kernel_size: 3
voiced_loss_weight: 2.0
learning_rate: 0.001
speaker_overlapping: true
